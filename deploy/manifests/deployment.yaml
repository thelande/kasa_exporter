---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kasa-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kasa-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kasa-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasa-exporter
    spec:
      containers:
        - name: kasa-exporter
          image: kasa-exporter:v0.2.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 32Mi
              cpu: 100m
            limits:
              memory: 64Mi
              cpu: 500m
          ports:
            - containerPort: 9907
              name: http
              protocol: TCP
