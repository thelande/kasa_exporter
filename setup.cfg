[metadata]
name = kasa_exporter
version = 0.1.0

[options]
packages =
    kasa_exporter
    kasa_exporter.collectors

install_requires =
    Flask~=2.0.1
    prometheus-client
    python-kasa
    werkzeug<3.0.0werkzeug

[options.entry_points]
wsgi_scripts =
    kasa_exporter-wsgi = kasa_exporter.app:get_application

[flake8]
max-line-length = 88
